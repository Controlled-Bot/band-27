<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a110c">
  <title>Welches Buch ist das?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Passwort -->
  <div id="gate" class="gate">
    <form id="gate-form" class="gate__card" autocomplete="off" novalidate>
      <div class="gate__seal" aria-hidden="true"><span>27</span></div>
      <h1 class="gate__title" data-text="passwortSeite.titel"></h1>
      <p class="gate__text" data-text="passwortSeite.text"></p>
      <label class="visually-hidden" for="gate-input">Passwort</label>
      <input id="gate-input" class="gate__input" type="password" inputmode="text"
             autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passwort">
      <button class="gate__btn" type="submit" data-text="passwortSeite.button"></button>
      <p class="gate__error" id="gate-error" role="alert"></p>
      <p class="gate__hint" data-text="passwortSeite.hinweis"></p>
    </form>
  </div>

  <!-- Buch -->
  <main id="stage" class="stage" hidden>
    <div id="book-host" class="book-host"></div>

    <nav class="controls" aria-label="Blättern">
      <button id="prev" class="ctrl" type="button" aria-label="Zurückblättern">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span id="counter" class="counter" aria-live="polite"></span>
      <button id="next" class="ctrl" type="button" aria-label="Weiterblättern">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>
    <p id="flip-hint" class="flip-hint"></p>
  </main>

  <button id="music" class="music" type="button" aria-pressed="false" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    <span class="music__slash" aria-hidden="true"></span>
  </button>

  <!-- Messbereich (unsichtbar), damit Texte vor dem Blättern passend skaliert werden -->
  <div id="measure" class="measure" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
