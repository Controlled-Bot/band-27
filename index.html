<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F5F2">
  <title>Welches Buch ist das?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Passwort -->
  <main id="gate" class="gate">
    <form id="gate-form" class="gate__form" autocomplete="off" novalidate>
      <span class="gate__mark" aria-hidden="true"></span>
      <h1 class="gate__title">Dieses Buch ist noch verschlossen.</h1>
      <p class="gate__text">Nur für eine bestimmte Leserin. Bitte gib das Passwort ein.</p>
      <label class="visually-hidden" for="gate-input">Passwort</label>
      <input id="gate-input" class="gate__input" type="password" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Passwort" enterkeyhint="go">
      <button id="gate-btn" class="gate__btn" type="submit">
        <span class="gate__btn-label">Aufschlagen</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <p id="gate-error" class="gate__error" role="alert"></p>
      <p id="gate-hint" class="gate__hint" hidden></p>
    </form>
  </main>

  <!-- Buch (wird nach dem Entschlüsseln gefüllt) -->
  <div id="progress" class="progress" hidden><span></span></div>
  <div id="deck" class="deck" hidden><div id="track" class="track"></div></div>

  <button id="music" class="music" type="button" aria-pressed="false" aria-label="Musik an" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    <span class="music__slash" aria-hidden="true"></span>
  </button>

  <script src="inhalt.enc.js"></script>
  <script src="app.js"></script>
</body>
</html>
