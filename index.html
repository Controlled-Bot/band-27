<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Welches Buch ist das?</title>

  <!-- Auf Apple-Geräten werden SF Pro und New York vom System genutzt; Inter und Fraunces sind nur Fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=5636bd68">
</head>
<body>

  <!-- Buch -->
  <div id="stage" class="stage">
    <div id="book" class="book"></div>
    <p id="open-hint" class="open-hint">Zum Öffnen tippen</p>
  </div>

  <!-- Schwebende Navigationsleiste -->
  <nav id="bar" class="bar" aria-label="Blättern" hidden>
    <button id="prev" class="bar__btn" type="button" aria-label="Zurückblättern">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    </button>
    <div class="bar__mid">
      <span id="bar-label" class="bar__label"></span>
      <span class="bar__track"><span id="bar-fill" class="bar__fill"></span></span>
    </div>
    <button id="next" class="bar__btn" type="button" aria-label="Weiterblättern">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
    </button>
    <button id="music" class="bar__btn bar__music" type="button" aria-pressed="false" aria-label="Musik an" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </button>
  </nav>

  <script src="inhalt.js?v=54b265f2"></script>
  <script src="app.js?v=f3dbe020"></script>
</body>
</html>
